name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Sync package.json version from tag
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -n "$TAG_NAME" ]; then
            CLEAN_VERSION="${TAG_NAME#v}"
            echo "Updating package.json version to $CLEAN_VERSION"
            node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.version = '$CLEAN_VERSION'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
          fi

      - name: Build Web Dist
        run: npm run build

      - name: Add Android Platform
        run: npx cap add android

      - name: Prepare Signing Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using persistent release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          elif [ ! -f "release.keystore" ]; then
            echo "Generating fallback persistent release.keystore..."
            keytool -genkey -v -keystore release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AutoFinance,O=AutoFinance,C=RU"
          fi

      - name: Configure Android Permissions, FileProvider & Versioning
        env:
          TAG_NAME: ${{ github.ref_name }}
          KEYSTORE_PATH: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: node scripts/configure-android.js

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        env:
          KEYSTORE_PATH: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Print APK Certificate Fingerprint (SHA-256)
        run: |
          APK_FILE="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_FILE" ]; then
            echo "=== APK CERTIFICATE FINGERPRINT (SHA-256) ==="
            keytool -printcert -jarfile "$APK_FILE" || true
          fi

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ github.ref_name }}
          body: |
            Автоматическая сборка APK для версии ${{ github.ref_name }}.
            Установите `app-debug.apk` на ваш Android-смартфон.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
